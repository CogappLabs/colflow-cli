version: 2

project_name: colflow

before:
  hooks:
    - go mod tidy

builds:
  - id: colflow
    main: ./cmd/colflow
    binary: colflow
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: colflow
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

homebrew_casks:
  - name: colflow
    repository:
      owner: CogappLabs
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/CogappLabs/colflow-cli"
    description: "CLI for Dagster collection-flow pipelines: runs, assets, parquet inspection, asset scaffolding"
    binary: colflow
    # Unsigned binary — strip macOS quarantine attribute on install so users
    # don't get the "cannot be opened because the developer cannot be verified" error.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr",
                           args: ["-dr", "com.apple.quarantine", "#{staged_path}/colflow"],
                           sudo: false
          end

release:
  github:
    owner: CogappLabs
    name: colflow-cli
  draft: false
  prerelease: auto
